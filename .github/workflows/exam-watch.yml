# ApolloMaths exam watch — AI-maintained.
# Checks the official exam pages and admissions news, proposes key dates and drafts sandbox-tested question generators,
# opens a pull request labelled "🤖 AI-maintained", and merges it automatically if the changed files load cleanly.
# If the check fails, the pull request stays open for a person to look at and nothing goes live.
name: Exam watch
on:
  schedule:
    - cron: '0 6 1 * *'        # monthly baseline (1st of each month)
    - cron: '0 6 * 6-11 1'     # every Monday, June–November (registration and test season)
    - cron: '0 6 15 2,3 *'     # mid-February and mid-March (new admissions policies)
  workflow_dispatch: {}        # run it by hand from the Actions tab
permissions:
  contents: write
  pull-requests: write
  pages: write
concurrency: exam-watch
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Check sources, dates and questions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node tools/exam-watch/watch.mjs
      - name: Safety check — the agent's files must load cleanly
        run: |
          for f in js/data/questions-agent.js js/data/exam-dates.js; do
            node -e "new Function(require('fs').readFileSync('$f','utf8'))" || { echo "::error::$f does not load"; exit 1; }
          done
      - name: Open the pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: exam-watch/update
          title: '🤖 AI-maintained update — exam watch'
          commit-message: '🤖 AI-maintained: exam watch update'
          labels: '🤖 AI-maintained'
          body-path: tools/exam-watch/latest-report.md
          add-paths: |
            tools/exam-watch/state.json
            tools/exam-watch/latest-report.md
            tools/exam-watch/reports/*
            js/data/questions-agent.js
            js/data/exam-dates.js
      - name: Merge it automatically
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --delete-branch --repo ${{ github.repository }}
      - name: Republish the site
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || echo "Pages will rebuild on its own"
