# ApolloMaths exam-watch: checks official exam pages and the wider admissions picture, drafts and double-checks
# new original questions, and opens a pull request with a report. Nothing goes live until the pull request is merged.
name: Exam watch
on:
  schedule:
    - cron: '0 6 1 * *'        # monthly baseline (1st of each month)
    - cron: '0 6 * 6-11 1'     # every Monday, June–November (registration and test season)
    - cron: '0 6 15 2,3 *'     # mid-February and mid-March (new admissions policies)
  workflow_dispatch: {}        # run it by hand from the Actions tab
permissions:
  contents: write
  pull-requests: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Check sources and draft questions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node tools/exam-watch/watch.mjs
      - name: Open a pull request for review
        uses: peter-evans/create-pull-request@v6
        with:
          branch: exam-watch/update
          title: 'Exam watch — ${{ github.run_id }}'
          commit-message: 'Exam watch: source check and proposed questions'
          body-path: tools/exam-watch/latest-report.md
          add-paths: |
            tools/exam-watch/state.json
            tools/exam-watch/latest-report.md
            tools/exam-watch/reports/*
            js/data/questions-agent.js
