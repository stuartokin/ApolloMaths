# ApolloMaths exam watch — AI-maintained.
# Checks the official exam pages and admissions news, proposes key dates and drafts sandbox-tested question generators,
# opens a pull request labelled "🤖 AI-maintained", and merges it automatically if the changed files load cleanly.
# If the check fails, the pull request stays open for a person to look at and nothing goes live.
name: Exam watch
on:
  schedule:
    - cron: '0 6 1 * *'        # monthly baseline (1st of each month)
    - cron: '0 6 * 6-11 1'     # every Monday, June–November (registration and test season)
    - cron: '0 6 15 2,3 *'     # mid-February and mid-March (new admissions policies)
  workflow_dispatch: {}        # run it by hand from the Actions tab
permissions:
  contents: write
  pull-requests: write
  pages: write
concurrency: exam-watch
jobs:
  # ---- Kill switch -------------------------------------------------------
  # Reads two small files before anything else runs:
  #   master: stuartokin.github.io/automation.json  (turns off every app)
  #   local:  automation.json at the top of this repo (turns off this app)
  # If either says "paused": true, automatic runs (schedule, issues,
  # comments, other workflows) stop here and change nothing. Runs started by
  # hand ("Run workflow") and your own uploads always go ahead.
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        name: Check the kill switches
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          flag() {
            local v
            v=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "$1?t=$(date +%s)" 2>/dev/null | jq -r '.paused' 2>/dev/null) || v=""
            case "$v" in true|false) echo "$v" ;; null) echo false ;; *) echo unknown ;; esac
          }
          MASTER=$(flag "https://raw.githubusercontent.com/stuartokin/stuartokin.github.io/main/automation.json")
          LOCAL=$(flag "https://raw.githubusercontent.com/$REPO/$SHA/automation.json")
          echo "Master switch (stuartokin.github.io/automation.json): paused = $MASTER"
          echo "This repo's switch (automation.json): paused = $LOCAL"
          GO=true
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "push" ]; then
            if [ "$MASTER" = "true" ] || [ "$LOCAL" = "true" ]; then
              echo "::notice title=Kill switch::A switch is set to paused, but this run was started by hand or by an upload, so it goes ahead."
            fi
          elif [ "$MASTER" = "true" ]; then
            GO=false
            echo "::notice title=Kill switch::Paused by master switch (stuartokin.github.io/automation.json). Nothing was changed."
          elif [ "$LOCAL" = "true" ]; then
            GO=false
            echo "::notice title=Kill switch::Paused by this repo's switch (automation.json). Nothing was changed."
          fi
          if [ "$MASTER" = "unknown" ]; then
            echo "::warning title=Kill switch::Could not read the master switch, so carrying on as normal."
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "Kill switch: master paused = $MASTER, this repo paused = $LOCAL, event = $EVENT, go = $GO" >> "$GITHUB_STEP_SUMMARY"

  watch:
    needs: switch
    if: needs.switch.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Check sources, dates and questions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node tools/exam-watch/watch.mjs
      - name: Safety check — the agent's files must load cleanly
        run: |
          for f in js/data/questions-agent.js js/data/exam-dates.js; do
            node -e "new Function(require('fs').readFileSync('$f','utf8'))" || { echo "::error::$f does not load"; exit 1; }
          done
      - name: Open the pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: exam-watch/update
          title: '🤖 AI-maintained update — exam watch'
          commit-message: '🤖 AI-maintained: exam watch update'
          labels: '🤖 AI-maintained'
          body-path: tools/exam-watch/latest-report.md
          add-paths: |
            tools/exam-watch/state.json
            tools/exam-watch/latest-report.md
            tools/exam-watch/reports/*
            js/data/questions-agent.js
            js/data/exam-dates.js
      - name: Merge it automatically
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --delete-branch --repo ${{ github.repository }}
      - name: Republish the site
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || echo "Pages will rebuild on its own"
